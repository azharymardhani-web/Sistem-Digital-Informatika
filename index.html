        function getTpsForClass(classId, myClasses, tps) {
            const cls = (myClasses || []).find(c => c.id === classId);
            const level = cls ? cls.level : 'VIII';
            return (tps || []).filter(t => !t.level || t.level === level);

        function calculateInformaticsScore(studentId, classId, scores, tps, weights = { formative: 30, practical: 40, pas: 30 }) {
            const studentScores = (scores && scores[classId] && scores[classId][studentId]) || {};
            
            const tpVals = (tps || []).map(tp => parseFloat(studentScores[tp.id])).filter(v => !isNaN(v));
            const avgFormative = tpVals.length > 0 ? Math.round(tpVals.reduce((a, b) => a + b, 0) / tpVals.length) : 0;
            
            const practicalScore = parseFloat(studentScores.practical) || 0;
            const pasScore = parseFloat(studentScores.pas) || 0;
            
            const safeWeights = weights || { formative: 30, practical: 40, pas: 30 };
            const wFormative = (safeWeights.formative !== undefined ? safeWeights.formative : 30) / 100;
            const wPractical = (safeWeights.practical !== undefined ? safeWeights.practical : 40) / 100;
            const wPas = (safeWeights.pas !== undefined ? safeWeights.pas : 30) / 100;

            const finalScore = Math.round((avgFormative * wFormative) + (practicalScore * wPractical) + (pasScore * wPas));
            
            let predicate = 'D';
            if (finalScore >= 90) predicate = 'A';
            else if (finalScore >= 80) predicate = 'B';
            else if (finalScore >= 70) predicate = 'C';

            return {
                avgFormative,
                practicalScore,
                pasScore,
                finalScore,
                predicate,
                descManual: studentScores.descManual || ''
            };
        }

        function generateCapaianDescription(res, tps) {
            if (res.descManual && res.descManual.trim() !== '') {

            if (res.finalScore >= 85) {

            } else {

            }
        }

        function PcLabTab({ students, pcData, setPcData, myClasses, selectedClass, setSelectedClass, attendance, showToast }) {
            const TOTAL_PCS = 32;
            const [selectedPc, setSelectedPc] = useState(null);
            const [pcModalOpen, setPcModalOpen] = useState(false);
            const [pcForm, setPcForm] = useState({ studentId: '', condition: 'normal', notes: '' });

            const classStudents = useMemo(() => (students || []).filter(s => s.classId === selectedClass), [students, selectedClass]);
            const currentClassPc = (pcData && pcData[selectedClass]) || {};

            const pcList = useMemo(() => {
                const list = [];
                for (let i = 1; i <= TOTAL_PCS; i++) {
                    const pcNum = `PC-${i < 10 ? '0' + i : i}`;
                    const assign = currentClassPc[pcNum] || { studentId: '', condition: 'normal', notes: '' };
                    const student = (students || []).find(s => s.id === assign.studentId);
                    list.push({ pcNum, ...assign, student });
                }
                return list;
            }, [currentClassPc, students]);

            const unassignedStudents = useMemo(() => {
                const assignedIds = new Set(pcList.map(p => p.studentId).filter(Boolean));
                return classStudents.filter(s => !assignedIds.has(s.id));
            }, [classStudents, pcList]);

            const gridRows = useMemo(() => {
                const rows = [];
                for (let r = 0; r < 4; r++) {
                    let items = pcList.slice(r * 8, (r + 1) * 8);
                    if (r % 2 === 0) {
                        items = [...items].reverse();
                    }
                    rows.push({
                        rowNum: r + 1,
                        dirText: r % 2 === 0 ? '◀ Kanan ke Kiri (Zigzag)' : '▶ Kiri ke Kanan (Zigzag)',
                        items: items
                    });
                }
                return rows;
            }, [pcList]);

            const stats = useMemo(() => {
                let assigned = 0, empty = 0, maintenance = 0, broken = 0;
                pcList.forEach(pc => {
                    if (pc.studentId) assigned++; else empty++;
                    if (pc.condition === 'maintenance') maintenance++;
                    if (pc.condition === 'broken') broken++;
                });
                return { assigned, empty, maintenance, broken, total: TOTAL_PCS };
            }, [pcList]);

            const handleAutoPlot = () => {
                setPcData(prev => {
                    const updated = { ...(prev || {}) };
                    const currentClassMap = { ...(updated[selectedClass] || {}) };
                    
                    classStudents.forEach((st, idx) => {
                        if (idx < TOTAL_PCS) {
                            const pcNum = `PC-${idx + 1 < 10 ? '0' + (idx + 1) : idx + 1}`;
                            const existingCond = (currentClassMap[pcNum] && currentClassMap[pcNum].condition) || 'normal';
                            const existingNotes = (currentClassMap[pcNum] && currentClassMap[pcNum].notes) || '';
                            currentClassMap[pcNum] = {
                                studentId: st.id,
                                condition: existingCond,
                                notes: existingNotes
                            };
                        }
                    });
                    updated[selectedClass] = currentClassMap;
                    return updated;
                });
                showToast(`Auto-plotting ${Math.min(classStudents.length, TOTAL_PCS)} siswa kelas ${selectedClass} berhasil!`);
            };

            const handleResetPlot = () => {
                setPcData(prev => {
                    const updated = { ...(prev || {}) };
                    updated[selectedClass] = {};
                    return updated;
                });
                showToast(`Plotting PC untuk kelas ${selectedClass} telah dikosongkan!`);
            };

            const openEditPc = (pc) => {
                setSelectedPc(pc.pcNum);
                setPcForm({
                    studentId: pc.studentId || '',
                    condition: pc.condition || 'normal',
                    notes: pc.notes || ''
                });
                setPcModalOpen(true);
            };

            const savePcEdit = (e) => {
                e.preventDefault();
                setPcData(prev => {
                    const updated = { ...(prev || {}) };
                    const currentClassMap = { ...(updated[selectedClass] || {}) };
                    currentClassMap[selectedPc] = { ...pcForm };
                    updated[selectedClass] = currentClassMap;
                    return updated;
                });
                setPcModalOpen(false);
                showToast(`Pengaturan Komputer ${selectedPc} berhasil diperbarui!`);
            };

            const handleDragStartStudent = (e, stId) => {
                e.dataTransfer.setData('text/plain', JSON.stringify({ type: 'student', studentId: stId }));
            };

            const handleDragStartPc = (e, pcNum) => {
                e.dataTransfer.setData('text/plain', JSON.stringify({ type: 'pc', pcNum }));
            };

            const handleDragOver = (e) => {
                e.preventDefault();
                e.currentTarget.classList.add('drag-over');
            };

            const handleDragLeave = (e) => {
                e.currentTarget.classList.remove('drag-over');
            };

            const handleDropOnPc = (e, targetPcNum) => {
                e.preventDefault();
                e.currentTarget.classList.remove('drag-over');
                const rawData = e.dataTransfer.getData('text/plain');
                if (!rawData) return;
                
                try {
                    const data = JSON.parse(rawData);
                    setPcData(prev => {
                        const updated = { ...(prev || {}) };
                        const currentClassMap = { ...(updated[selectedClass] || {}) };

                            currentClassMap[targetPcNum] = { ...prevTarget, studentId: stId };

                            currentClassMap[sourcePcNum] = { ...sourceData, studentId: targetData.studentId };
                            currentClassMap[targetPcNum] = { ...targetData, studentId: tempSt };
                        }
                        updated[selectedClass] = currentClassMap;
                        return updated;

        function StudentManagementTab({ students, setStudents, setScores, setAttendance, myClasses, selectedClass, setSelectedClass, showToast, triggerConfirm }) {
            const [selectedStudentIds, setSelectedStudentIds] = useState([]);
            const [newStudent, setNewStudent] = useState({ nisn: '', name: '', gender: 'L', classId: selectedClass });
            const [editingId, setEditingId] = useState(null);
            const [editForm, setEditForm] = useState({ nisn: '', name: '', gender: 'L', classId: '' });
            const [previewData, setPreviewData] = useState(null);
            const [importTargetClass, setImportTargetClass] = useState(selectedClass);

            useEffect(() => {
                setSelectedStudentIds([]);
                setNewStudent(prev => ({ ...prev, classId: selectedClass }));
                setImportTargetClass(selectedClass);
            }, [selectedClass]);

            const classStudents = useMemo(() => (students || []).filter(s => s.classId === selectedClass), [students, selectedClass]);
            const totalAllStudents = (students || []).length;
            const isAllSelected = classStudents.length > 0 && classStudents.every(s => selectedStudentIds.includes(s.id));

            const handleToggleSelectAll = () => {
                if (isAllSelected) {
                    setSelectedStudentIds([]);
                } else {
                    setSelectedStudentIds(classStudents.map(s => s.id));
                }
            };

            const handleToggleSelectStudent = (id) => {
                setSelectedStudentIds(prev => 
                    prev.includes(id) ? prev.filter(item => item !== id) : [...prev, id]
                );
            };

            const handleAddStudent = (e) => {
                e.preventDefault();
                if (!newStudent.name.trim() || !newStudent.nisn.trim()) {
                    showToast('Nomor Absen/ID dan Nama Siswa wajib diisi!', 'error');
                    return;
                }
                const targetCls = newStudent.classId || selectedClass;
                const created = {
                    id: 'st-' + Date.now(),
                    nisn: newStudent.nisn.trim(),
                    name: newStudent.name.trim(),
                    gender: newStudent.gender,
                    classId: targetCls
                };
                setStudents(prev => [...(prev || []), created]);
                setNewStudent({ nisn: '', name: '', gender: 'L', classId: targetCls });
                showToast(`Siswa ${created.name} berhasil ditambahkan ke ${targetCls}!`);
            };

            const startEdit = (st) => {
                setEditingId(st.id);
                setEditForm({ nisn: st.nisn, name: st.name, gender: st.gender, classId: st.classId });
            };

            const saveEdit = (id) => {
                setStudents(prev => (prev || []).map(s => s.id === id ? { ...s, ...editForm } : s));
                setEditingId(null);
                showToast('Data siswa berhasil diperbarui!');
            };

            const handleDeleteStudent = (st) => {
                triggerConfirm(
                    'Hapus Data Siswa',
                    `Apakah Anda yakin ingin menghapus "${st.name}"? Seluruh riwayat presensi dan nilai siswa ini akan dihapus dari database.`,
                    () => {
                        setStudents(prev => (prev || []).filter(s => s.id !== st.id));
                        setScores(prev => {
                            const updated = { ...(prev || {}) };
                            if (updated[selectedClass]) {
                                const currentClassScores = { ...updated[selectedClass] };
                                delete currentClassScores[st.id];
                                updated[selectedClass] = currentClassScores;
                            }
                            return updated;
                        });
                        showToast(`Siswa ${st.name} berhasil dihapus!`);
                    }
                );
            };

            const handleBulkDelete = (idsToDelete, description) => {
                triggerConfirm(
                    'Hapus Siswa Terpilih',
                    `Apakah Anda yakin ingin menghapus ${idsToDelete.length} siswa ${description}? Semua riwayat presensi dan nilainya akan dibersihkan.`,
                    () => {
                        const setIds = new Set(idsToDelete);
                        setStudents(prev => (prev || []).filter(s => !setIds.has(s.id)));
                        setScores(prev => {
                            const updated = { ...(prev || {}) };
                            if (updated[selectedClass]) {
                                const currentClassScores = { ...updated[selectedClass] };
                                idsToDelete.forEach(id => {
                                    delete currentClassScores[id];
                                });
                                updated[selectedClass] = currentClassScores;
                            }
                            return updated;
                        });
                        setSelectedStudentIds([]);
                        showToast(`${idsToDelete.length} data siswa berhasil dihapus!`);
                    }
                );
            };

            const handleDownloadTemplate = () => {
                if (!window.XLSX) {
                    showToast("Library SheetJS (XLSX) belum siap.", "error");
                    return;
                }
                const wb = XLSX.utils.book_new();
                const wsData = [
                    ["NO_ABSEN", "NAMA_SISWA", "GENDER", "KELAS"],
                    [`${selectedClass}-01`, "Ahmad Abdullah", "L", selectedClass],
                    [`${selectedClass}-02`, "Siti Aminah", "P", selectedClass]
                ];
                const ws = XLSX.utils.aoa_to_sheet(wsData);
                XLSX.utils.book_append_sheet(wb, ws, "Template_Siswa");
                XLSX.writeFile(wb, `Template_Import_Siswa_${selectedClass}.xlsx`);
            };

            const handleFileUpload = (e) => {
                const file = e.target.files[0];
                if (!file) return;

                if (!window.XLSX) {
                    showToast("Library SheetJS (XLSX) belum siap.", "error");
                    return;
                }

                const reader = new FileReader();
                reader.onload = (evt) => {
                    try {
                        const data = new Uint8Array(evt.target.result);
                        const workbook = XLSX.read(data, { type: 'array' });
                        const sheetName = workbook.SheetNames[0];
                        const worksheet = workbook.Sheets[sheetName];
                        const json = XLSX.utils.sheet_to_json(worksheet, { defval: "" });

                        if (!json || json.length === 0) {
                            showToast("File Excel kosong atau format tidak sesuai!", "error");
                            return;
                        }

                        const getVal = (row, keys) => {
                            const foundKey = Object.keys(row).find(k => 
                                keys.some(key => k.trim().toLowerCase() === key.toLowerCase())
                            );
                            return foundKey ? String(row[foundKey]).trim() : "";
                        };

                        const parsed = json.map((row, idx) => {

            const handleAdminLogin = (e) => {
                e.preventDefault();
                if (loginInput === adminPassword) {
                    setIsAuthenticated(true);
                    sessionStorage.setItem('simadrasah_authenticated', 'true');
                    setLoginError('');
                    setLoginInput('');
                    showToast('Berhasil masuk sebagai Admin SIMADRASAH!');
                } else {
                    setLoginError('Password Admin salah! Silakan coba lagi.');
                }
            };

            const handleAdminLogout = () => {
                setIsAuthenticated(false);
                sessionStorage.removeItem('simadrasah_authenticated');
                showToast('Sesi Admin dikunci.');
            };

            useEffect(() => {
                try {
                    localStorage.setItem('simadrasah_admin_password', adminPassword);
                } catch(e) {}
            }, [adminPassword]);

            const [teacher, setTeacher] = useState(() => {
                try {
                    const saved = localStorage.getItem('simadrasah_teacher');
                    return saved ? JSON.parse(saved) : {
                        name: 'Azhary Mardhani, S.Kom.',
                        nip: '19880512 201503 1 002',
                        subject: 'Informatika',
                        school: 'MTs Negeri 1 Jakarta',
                        phone: ''
                    };
                } catch(e) {
                    return { name: 'Azhary Mardhani, S.Kom.', nip: '19880512 201503 1 002', subject: 'Informatika', school: 'MTs Negeri 1 Jakarta', phone: '' };
                }
            });

            const [settings, setSettings] = useState(() => {
                try {
                    const saved = localStorage.getItem('simadrasah_settings');
                    return saved ? JSON.parse(saved) : { weights: { formative: 30, practical: 40, pas: 30 } };
                } catch(e) {
                    return { weights: { formative: 30, practical: 40, pas: 30 } };
                }
            });

            const [activeYear, setActiveYear] = useState(() => {
                try {
                    return localStorage.getItem('simadrasah_active_year') || '2026/2027';
                } catch(e) { return '2026/2027'; }
            });
            const [activeSemester, setActiveSemester] = useState(() => {
                try {
                    return localStorage.getItem('simadrasah_active_semester') || 'Ganjil';
                } catch(e) { return 'Ganjil'; }
            });

            useEffect(() => {
                try {
                    localStorage.setItem('simadrasah_active_year', activeYear);
                    localStorage.setItem('simadrasah_active_semester', activeSemester);
                } catch(e) {}
            }, [activeYear, activeSemester]);

            const [myClasses, setMyClasses] = useState(() => {
                try {
                    const saved = localStorage.getItem('simadrasah_classes');
                    return saved ? JSON.parse(saved) : INITIAL_CLASSES;
                } catch(e) { return INITIAL_CLASSES; }
            });

            const [selectedClass, setSelectedClass] = useState('8A');

            const [tps, setTps] = useState(() => {
                try {
                    const saved = localStorage.getItem('simadrasah_tps');
                    return saved ? JSON.parse(saved) : INITIAL_TPS;
                } catch(e) { return INITIAL_TPS; }
            });

            const [students, setStudents] = useState(() => {
                try {
                    const saved = localStorage.getItem('simadrasah_students');
                    return saved ? JSON.parse(saved) : INITIAL_STUDENTS;
                } catch(e) { return INITIAL_STUDENTS; }
            });

            const [scores, setScores] = useState(() => {
                try {
                    const saved = localStorage.getItem('simadrasah_scores');
                    return saved ? JSON.parse(saved) : INITIAL_SCORES;
                } catch(e) { return INITIAL_SCORES; }
            });

            const [groups, setGroups] = useState(() => {
                try {
                    const saved = localStorage.getItem('simadrasah_groups');
                    return saved ? JSON.parse(saved) : INITIAL_GROUPS;
                } catch(e) { return INITIAL_GROUPS; }
            });

            const [attendance, setAttendance] = useState(() => {
                try {
                    const saved = localStorage.getItem('simadrasah_attendance');
                    return saved ? JSON.parse(saved) : INITIAL_ATTENDANCE;
                } catch(e) { return INITIAL_ATTENDANCE; }
            });

            const [pcData, setPcData] = useState(() => {
                try {
                    const saved = localStorage.getItem('simadrasah_pcdata');
                    return saved ? JSON.parse(saved) : {};
                } catch(e) { return {}; }
            });

            const [toasts, setToasts] = useState([]);
            const [confirmModal, setConfirmModal] = useState({ isOpen: false, title: '', message: '', onConfirm: null });

            const [isCloudReady, setIsCloudReady] = useState(false);
            const [user, setUser] = useState(null);
            const [syncStatus, setSyncStatus] = useState('Cloud Ready');

            const saveTimeoutRef = useRef(null);

            const showToast = useCallback((message, type = 'success') => {
                const id = Date.now();
                setToasts(prev => [...prev, { id, message, type }]);
                setTimeout(() => {
                    setToasts(prev => prev.filter(t => t.id !== id));
                }, 3500);
            }, []);

            const triggerConfirm = useCallback((title, message, onConfirm) => {
                setConfirmModal({
                    isOpen: true,
                    title,
                    message,
                    onConfirm: () => {
                        onConfirm();
                        setConfirmModal({ isOpen: false, title: '', message: '', onConfirm: null });
                    }
                });
            }, []);

            const saveToCloud = useCallback(async (dataToSync) => {
                if (!window.FirebaseCloud || !isCloudReady) return;
                try {
                    setSyncStatus('Saving...');
                    const { db, doc, setDoc } = window.FirebaseCloud;
                    const targetAppId = window.FirebaseCloud.appId || 'simadrasah-app';
                    const docRef = doc(db, 'artifacts', targetAppId, 'public', 'data', 'simadrasah', 'main_data');
                    await setDoc(docRef, { ...dataToSync, lastUpdated: new Date().toISOString() }, { merge: true });
                    setSyncStatus('Synced');
                } catch (err) {
                    console.warn("Cloud Save warning (fallback to Local):", err.message || err);
                    setSyncStatus('Local Only');
                }
            }, [isCloudReady]);

            useEffect(() => {
                if (window.FirebaseCloud) {
                    const { auth, signInAnonymously, signInWithCustomToken, onSnapshot, doc, db } = window.FirebaseCloud;
                    const targetAppId = window.FirebaseCloud.appId || 'simadrasah-app';

                    const authenticate = async () => {
                        try {
                            if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                                return await signInWithCustomToken(auth, __initial_auth_token);
                            } else {
                                return await signInAnonymously(auth);
                            }
                        } catch (e) {
                            return await signInAnonymously(auth);
                        }
                    };

                    authenticate().then(res => {
                        setUser(res.user);
                        setIsCloudReady(true);
                        setSyncStatus('Synced');
                        
                        let docRef;
                        try {
                            docRef = doc(db, 'artifacts', targetAppId, 'public', 'data', 'simadrasah', 'main_data');
                        } catch(e) {
                            docRef = doc(db, 'simadrasah_records', 'main_data');
                        }

                        onSnapshot(docRef, 
                            (snapshot) => {
                                if (snapshot && snapshot.exists()) {
                                    const cData = snapshot.data();
                                    if (cData.teacher) setTeacher(cData.teacher);
                                    if (cData.settings) setSettings(cData.settings);
                                    if (cData.myClasses) setMyClasses(cData.myClasses);
                                    if (cData.tps) setTps(cData.tps);
                                    if (cData.students) setStudents(cData.students);
                                    if (cData.scores) setScores(cData.scores);
                                    if (cData.groups) setGroups(cData.groups);
                                    if (cData.attendance) setAttendance(cData.attendance);
                                    if (cData.pcData) setPcData(cData.pcData);
                                    if (cData.activeYear) setActiveYear(cData.activeYear);
                                    if (cData.activeSemester) setActiveSemester(cData.activeSemester);
                                    setSyncStatus('Synced');
                                }
                            },
                            (error) => {
                                console.warn("Firestore snapshot listener permission error, fallback to Local Mode:", error.message);
                                setIsCloudReady(false);
                                setSyncStatus('Local Only');
                            }
                        );
                    }).catch((err) => {
                        console.warn("Cloud connection error, fallback to Local Mode:", err.message);
                        setIsCloudReady(false);
                        setSyncStatus('Local Only');
                    });
                } else {
                    setSyncStatus('Local Only');
                }
            }, []);

            useEffect(() => {
                localStorage.setItem('simadrasah_teacher', JSON.stringify(teacher));
                localStorage.setItem('simadrasah_settings', JSON.stringify(settings));
                localStorage.setItem('simadrasah_classes', JSON.stringify(myClasses));
                localStorage.setItem('simadrasah_tps', JSON.stringify(tps));
                localStorage.setItem('simadrasah_students', JSON.stringify(students));
                localStorage.setItem('simadrasah_scores', JSON.stringify(scores));
                localStorage.setItem('simadrasah_groups', JSON.stringify(groups));
                localStorage.setItem('simadrasah_attendance', JSON.stringify(attendance));
                localStorage.setItem('simadrasah_pcdata', JSON.stringify(pcData));

                if (isCloudReady) {
                    if (saveTimeoutRef.current) clearTimeout(saveTimeoutRef.current);
                    saveTimeoutRef.current = setTimeout(() => {
                        saveToCloud({ teacher, settings, myClasses, tps, students, scores, groups, attendance, pcData, activeYear, activeSemester });
                    }, 1500);
                }
            }, [teacher, settings, myClasses, tps, students, scores, groups, attendance, pcData, activeYear, activeSemester, isCloudReady, saveToCloud]);

            const navItems = [
                { id: 'dashboard', label: 'Dashboard Utama', icon: 'dashboard' },
                { id: 'absensi', label: 'Presensi Lab Komputer', icon: 'attendance' },
                { id: 'pc_lab', label: 'Denah & PC Client Lab', icon: 'pc' },
                { id: 'penilaian', label: 'Input Nilai Grid', icon: 'grading' },
                { id: 'rekap', label: 'Rekap Leger Nilai', icon: 'recap' },
                { id: 'rdm', label: 'Ekspor RDM Rapor', icon: 'rdm' },
                { id: 'klasemen', label: 'Klasemen & Juara', icon: 'klasemen' },
                { id: 'siswa', label: 'Kelola Siswa', icon: 'students' },
                { id: 'pengaturan', label: 'Pengaturan System', icon: 'settings' }
            ];

            return (
                <div className="min-h-screen flex bg-slate-50">
                    <aside className={`fixed lg:static inset-y-0 left-0 z-40 bg-slate-900 text-white transition-all duration-300 flex flex-col justify-between ${
                        isSidebarCollapsed ? 'w-20' : 'w-64'
                    } ${isMobileMenuOpen ? 'translate-x-0' : '-translate-x-full lg:translate-x-0'}`}>
                        <div className="p-4 flex items-center justify-between border-b border-slate-800">
                            {!isSidebarCollapsed && (
                                <div className="flex items-center gap-2">
                                    <div className="w-8 h-8 rounded-xl bg-sky-500 flex items-center justify-center font-black text-white text-sm">
                                        M
                                    </div>
                                    <span className="font-extrabold text-sm tracking-tight text-white">SIMADRASAH</span>
                                </div>
                            )}
                            <button 
                                onClick={() => setIsSidebarCollapsed(!isSidebarCollapsed)}
                                className="p-1.5 rounded-lg text-slate-400 hover:text-white hover:bg-slate-800 transition hidden lg:block"
                            >
                                <Icon name={isSidebarCollapsed ? "chevronRight" : "chevronLeft"} className="w-5 h-5" />
                            </button>
                        </div>

                        <nav className="p-3 space-y-1 flex-1 overflow-y-auto">
                            {navItems.map(item => (
                                <button
                                    key={item.id}
                                    onClick={() => {
                                        setActiveTab(item.id);
                                        setIsMobileMenuOpen(false);
                                    }}
                                    className={`w-full flex items-center gap-3 px-3 py-3 rounded-xl font-bold text-xs transition ${
                                        activeTab === item.id 
                                            ? 'bg-sky-600 text-white shadow-md' 
                                            : 'text-slate-400 hover:text-white hover:bg-slate-800/80'
                                    }`}
                                    title={isSidebarCollapsed ? item.label : ''}
                                >
                                    <Icon name={item.icon} className="w-5 h-5 shrink-0" />
                                    {!isSidebarCollapsed && <span className="truncate">{item.label}</span>}
                                </button>
                            ))}
                        </nav>

                        <div className="p-4 border-t border-slate-800">
                            {!isSidebarCollapsed ? (
                                <div className="text-xs space-y-1">
                                    <p className="font-bold text-slate-200 truncate">{teacher.name}</p>
                                    <p className="text-[10px] text-slate-400 truncate">{teacher.school}</p>
                                    <div className="pt-2 flex items-center gap-1.5 text-[10px] text-emerald-400 font-bold">
                                        <Icon name="cloud" className="w-3.5 h-3.5" />
                                        <span>{syncStatus === 'Synced' ? '🟢 Synced (Firebase)' : '⚪ Local Only'}</span>
                                    </div>
                                </div>
                            ) : (
                                <div className="flex justify-center text-emerald-400" title={syncStatus}>
                                    <Icon name="cloud" className="w-5 h-5" />
                                </div>
                            )}
                        </div>
                    </aside>

                    <div className="flex-1 flex flex-col min-w-0">
                        <header className="bg-white border-b border-slate-200 p-4 flex items-center justify-between sticky top-0 z-30">
                            <div className="flex items-center gap-3">
                                <button 
                                    onClick={() => setIsMobileMenuOpen(!isMobileMenuOpen)}
                                    className="p-2 text-slate-600 rounded-xl hover:bg-slate-100 lg:hidden"
                                >
                                    <Icon name="menu" className="w-6 h-6" />
                                </button>
                                <h1 className="text-sm font-extrabold text-slate-900 uppercase tracking-wide">
                                    {navItems.find(n => n.id === activeTab)?.label}
                                </h1>
                            </div>

                            <div className="flex items-center gap-3">
                                <span className="px-3 py-1 bg-sky-50 text-sky-800 border border-sky-200 rounded-full text-xs font-bold">
                                    {activeYear} ({activeSemester})
                                </span>
                                <button 
                                    onClick={handleAdminLogout}
                                    className="px-3 py-1 bg-rose-50 hover:bg-rose-100 text-rose-700 border border-rose-200 rounded-full text-xs font-bold transition flex items-center gap-1"
                                    title="Kunci Akses Admin"
                                >
                                    <span>🔒 Lock</span>
                                </button>
                            </div>
                        </header>

                        <main className="p-4 sm:p-6 lg:p-8 flex-1 overflow-y-auto">
                            {activeTab === 'dashboard' && (
                                <DashboardTab students={students} myClasses={myClasses} teacher={teacher} activeYear={activeYear} activeSemester={activeSemester} setActiveTab={setActiveTab} />
                            )}
                            {activeTab === 'absensi' && (
                                <AttendanceTab students={students} attendance={attendance} setAttendance={setAttendance} myClasses={myClasses} selectedClass={selectedClass} setSelectedClass={setSelectedClass} showToast={showToast} />
                            )}
                            {activeTab === 'pc_lab' && (
                                <PcLabTab students={students} pcData={pcData} setPcData={setPcData} myClasses={myClasses} selectedClass={selectedClass} setSelectedClass={setSelectedClass} attendance={attendance} showToast={showToast} />
                            )}
                            {activeTab === 'penilaian' && (
                                <GradingTab students={students} scores={scores} setScores={setScores} myClasses={myClasses} selectedClass={selectedClass} setSelectedClass={setSelectedClass} tps={tps} settings={settings} showToast={showToast} />
                            )}
                            {activeTab === 'rekap' && (
                                <RecapTab students={students} scores={scores} myClasses={myClasses} tps={tps} settings={settings} teacher={teacher} activeYear={activeYear} activeSemester={activeSemester} showToast={showToast} />
                            )}
                            {activeTab === 'rdm' && (
                                <RdmExportTab students={students} scores={scores} attendance={attendance} myClasses={myClasses} tps={tps} settings={settings} teacher={teacher} activeYear={activeYear} activeSemester={activeSemester} showToast={showToast} />
                            )}
                            {activeTab === 'klasemen' && (
                                <KlasemenTab students={students} scores={scores} groups={groups} setGroups={setGroups} myClasses={myClasses} tps={tps} settings={settings} teacher={teacher} activeYear={activeYear} activeSemester={activeSemester} showToast={showToast} triggerConfirm={triggerConfirm} />
                            )}
                            {activeTab === 'siswa' && (
                                <StudentManagementTab students={students} setStudents={setStudents} setScores={setScores} setAttendance={setAttendance} myClasses={myClasses} selectedClass={selectedClass} setSelectedClass={setSelectedClass} showToast={showToast} triggerConfirm={triggerConfirm} />
                            )}
                            {activeTab === 'pengaturan' && (
                                <SettingsTab settings={settings} setSettings={setSettings} teacher={teacher} setTeacher={setTeacher} myClasses={myClasses} setMyClasses={setMyClasses} tps={tps} setTps={setTps} students={students} setStudents={setStudents} setScores={setScores} setAttendance={setAttendance} syncStatus={syncStatus} showToast={showToast} triggerConfirm={triggerConfirm} adminPassword={adminPassword} setAdminPassword={setAdminPassword} activeYear={activeYear} setActiveYear={setActiveYear} activeSemester={activeSemester} setActiveSemester={setActiveSemester} />
                            )}
                        </main>
                    </div>

                    {!isAuthenticated && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/80 backdrop-blur-md p-4 animate-in fade-in duration-200">
                            <div className="bg-white rounded-3xl max-w-md w-full p-8 shadow-2xl space-y-6 border border-slate-100 text-center">
                                <div className="w-16 h-16 rounded-2xl bg-sky-600 text-white font-black text-2xl flex items-center justify-center mx-auto shadow-lg shadow-sky-600/30">
                                    M
                                </div>
                                <div>
                                    <h2 className="text-xl font-extrabold text-slate-900 tracking-tight">SIMADRASAH LOGIN</h2>
                                    <p className="text-xs text-slate-500 font-medium mt-1">Masukkan Password Admin untuk Membuka Akses Menu & Data</p>
                                </div>

                                <form onSubmit={handleAdminLogin} className="space-y-4 text-left">
                                    <div>
                                        <label className="block text-xs font-bold text-slate-700 mb-1.5">Password Admin:</label>
                                        <input 
                                            type="password"
                                            value={loginInput}
                                            onChange={e => {
                                                setLoginInput(e.target.value);
                                                setLoginError('');
                                            }}
                                            placeholder="Masukkan password admin..."
                                            className="w-full px-4 py-3 border border-slate-300 rounded-xl text-sm font-bold text-slate-900 focus:ring-2 focus:ring-sky-500 focus:outline-none transition"
                                            autoFocus
                                        />
                                        {loginError && (
                                            <p className="text-xs font-bold text-rose-600 mt-1.5 flex items-center gap-1">
                                                <span>⚠️</span> {loginError}
                                            </p>
                                        )}
                                    </div>
                                    <button 
                                        type="submit"
                                        className="w-full py-3 bg-sky-600 hover:bg-sky-700 active:bg-sky-800 text-white font-extrabold text-sm rounded-xl shadow-lg shadow-sky-600/25 transition transform active:scale-[0.98]"
                                    >
                                        🔓 Masuk ke Sistem
                                    </button>
                                </form>

                                <div className="pt-2 border-t border-slate-100 text-[11px] text-slate-600">
                                    💡 <span className="font-semibold">Password Default:</span> <code className="bg-slate-100 text-slate-800 px-2 py-0.5 rounded font-mono font-bold">admin123</code>
                                </div>
                            </div>
                        </div>
                    )}

                    <ConfirmationModal 
                        isOpen={confirmModal.isOpen}
                        title={confirmModal.title}
                        message={confirmModal.message}
                        onConfirm={confirmModal.onConfirm}
                        onCancel={() => setConfirmModal({ ...confirmModal, isOpen: false })}
                    />
                    <ToastContainer toasts={toasts} />
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
